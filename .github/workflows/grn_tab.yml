name: GRN tab of the SKU POD trackers

# Rewrites the "GRN DATA" tab of the current and previous month's "<Month YYYY> - SKU POD MASTER TRACKER"
# Google Sheets from Supabase (grn_tab_writer.py), replacing the daily hand paste from the "grnpy"
# consolidation sheet (retired 2026-10-14).
#
# STARTED BY SUPABASE since 2026-10-28: pg_cron job grn-tab-dispatch sends a workflow_dispatch at 08:00 and
# 18:00 IST (pg_cron_grn_tab_dispatch.sql; log in public.grn_tab_dispatch_log). The schedule below is only a
# fallback: GitHub started it 4.5-6 h late every day (01:45 UTC = 07:15 IST asked, 11:45-13:05 IST ran).
#
# The service account must be shared on each month's tracker as EDITOR (the POD loader only needs
# Viewer); a read-only tracker is reported in the log and skipped. The owner granted that to
# sheets-loader@natural-system-459204-j9.iam.gserviceaccount.com (secret GRN_TAB_SERVICE_ACCOUNT, set
# 2026-10-15); the dashboard / POD loader key (GOOGLE_SERVICE_ACCOUNT, podashboard@) is the fallback.

on:
  schedule:
    - cron: "45 1 * * *"
  workflow_dispatch:
    inputs:
      month:
        description: 'only this tracker, e.g. "October 2026" (blank = current + previous month)'
        default: ''
      dry_run:
        description: 'query Supabase and report the row counts, write nothing'
        type: boolean
        default: false

permissions:
  contents: read

# a late scheduled run must not overlap the next one (the tab is cleared and rewritten)
concurrency:
  group: grn-tab
  cancel-in-progress: false

jobs:
  grn_tab:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements-supabase.txt

      - name: Write the service account key
        env:
          SA: ${{ secrets.GRN_TAB_SERVICE_ACCOUNT || secrets.GOOGLE_SERVICE_ACCOUNT }}
        run: printf '%s' "$SA" > "$RUNNER_TEMP/service_account.json"

      - name: Rewrite the GRN DATA tabs
        env:
          SKU_POD_SERVICE_ACCOUNT: ${{ runner.temp }}/service_account.json
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          PGSSLMODE: require
        run: |
          ARGS=""
          if [ -n "${{ github.event.inputs.month }}" ]; then ARGS="$ARGS --month \"${{ github.event.inputs.month }}\""; fi
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then ARGS="$ARGS --dry-run"; fi
          eval python grn_tab_writer.py $ARGS
